let cat="Все",q="";
function copy(text,btn,label){
  const ok=()=>{const t=document.getElementById('toast');t.textContent=label||'Скопировано';t.classList.add('s');setTimeout(()=>t.classList.remove('s'),1400);
    if(btn){const o=btn.textContent;btn.textContent='Скопировано ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1400)}};
  const fb=()=>{const a=document.createElement('textarea');a.value=text;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();
    let r=false;try{r=document.execCommand('copy')}catch(e){}a.remove();if(r)ok();else{const t=document.getElementById('toast');t.textContent='Не удалось — выделите текст вручную';t.classList.add('s');setTimeout(()=>t.classList.remove('s'),2200)}};
  try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function topBox(){
  const b=mk('div','box top');
  b.append(mk('div','h','Общий негатив (negative prompt)'));
  b.append(mk('div','p',D.neg));
  const c=mk('button','cp full','Копировать негатив');c.onclick=()=>copy(D.neg,c);b.append(c);
  b.append(mk('div','h','Общий стиль (уже есть в каждом промте)'));
  b.append(mk('div','p',D.style));
  const c2=mk('button','cp full','Копировать стиль');c2.onclick=()=>copy(D.style,c2);b.append(c2);
  return b}
function render(){
  const m=document.getElementById('m');m.innerHTML='';
  if(cat==="Все"&&!q)m.append(topBox());
  const list=D.items.filter(i=>(cat==="Все"||i.cat===cat)&&(!q||(i.file+' '+i.p).toLowerCase().includes(q)));
  if(cat!=="Все"&&list.length>1&&!q){
    const b=mk('div','box');const c=mk('button','cp full','Копировать все промты категории ('+list.length+')');
    c.onclick=()=>copy(list.map(i=>'### '+i.file+' ('+i.size+')\n'+i.p).join('\n\n'),c,'Скопировано: '+list.length);b.append(c);m.append(b)}
  list.forEach(i=>{
    const b=mk('div','box');const r=mk('div','row');const l=mk('div');
    l.append(mk('div','f',i.file));l.append(mk('div','sz',i.size+' · '+i.cat));
    const c=mk('button','cp','Копировать');c.onclick=()=>copy(i.p,c);r.append(l,c);
    b.append(r,mk('div','p',i.p));m.append(b)});
  if(!list.length)m.append(mk('div','sub','Ничего не найдено'));
}
const ch=document.getElementById('chips');
['Все',...D.cats].forEach(n=>{const c=mk('button','chip'+(n===cat?' on':''),n);c.onclick=()=>{cat=n;[...ch.children].forEach(x=>x.classList.toggle('on',x.textContent===n));render();scrollTo(0,0)};ch.append(c)});
document.getElementById('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
render();
</script></body></html>
