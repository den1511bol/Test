# HackSim - Developer: @yfeeeee
# Собирает APK при каждом push и публикует его в Releases (тег hacksim-latest).
name: Build APK

on:
  push:
    branches: [hacksim]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackSim-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HackSim.apk
          gh release delete hacksim-latest --cleanup-tag -y || true
          gh release create hacksim-latest HackSim.apk --target "$GITHUB_SHA" --title "HackSim (latest)" --notes "Developer: \`@yfeeeee\`. Скачай HackSim.apk и установи на телефон."
