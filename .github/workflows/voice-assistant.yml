# Developer: @yfeeeee
name: voice-assistant

on:
  push:
    paths:
      - "voice-assistant/**"
      - ".github/workflows/voice-assistant.yml"
  pull_request:
    paths:
      - "voice-assistant/**"
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest starlette
      - run: PYTHONPATH=.:tests python -m pytest -q tests
        working-directory: voice-assistant/server

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Модели openWakeWord
        run: |
          ASSETS=voice-assistant/android/app/src/main/assets
          BASE=https://github.com/dscripka/openWakeWord/releases/download/v0.5.1
          mkdir -p "$ASSETS"
          curl -fsSL -o "$ASSETS/melspectrogram.onnx" "$BASE/melspectrogram.onnx"
          curl -fsSL -o "$ASSETS/embedding_model.onnx" "$BASE/embedding_model.onnx"
          if [ -f voice-assistant/models/wakeword.onnx ]; then
            cp voice-assistant/models/wakeword.onnx "$ASSETS/wakeword.onnx"
            echo "Используется ваша модель voice-assistant/models/wakeword.onnx"
          else
            curl -fsSL -o "$ASSETS/wakeword.onnx" "$BASE/alexa_v0.1.onnx"
            echo "::warning::voice-assistant/models/wakeword.onnx не найден — для теста взята модель 'alexa'"
          fi

      - name: Сборка debug APK
        run: gradle -p voice-assistant/android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-apk
          path: voice-assistant/android/app/build/outputs/apk/debug/app-debug.apk
