name: Build Android APK

# Developer: @yfeeeee
# Собирает APK на каждом пуше в main и публикует его в релиз "latest".
# Адрес сервера Railway задаётся в Settings → Secrets and variables → Actions → Variables → API_URL
# (например https://ashen-crown-production.up.railway.app). Его можно сменить и внутри игры (Ещё → Настройки).

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'server/**', 'test/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Тесты игровой логики и сервера
        run: node --test --test-force-exit test/*.test.js

      - name: Подготовить веб-ресурсы
        run: node client/scripts/prepare.js

      - name: Установить Capacitor
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Создать Android-проект
        working-directory: client
        run: npx cap add android

      - name: Применить иконки и настройки
        run: node client/scripts/android-patch.js
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Синхронизировать веб-ресурсы
        working-directory: client
        run: npx cap sync android

      - name: Собрать APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp client/android/app/build/outputs/apk/debug/app-debug.apk AshenCrown.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AshenCrown-apk
          path: AshenCrown.apk
          retention-days: 30

      - name: Опубликовать в релиз latest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AshenCrown.apk \
            --title "Ashen Crown — последняя сборка" \
            --notes "Автоматическая сборка #${{ github.run_number }} (коммит ${GITHUB_SHA::7}). Debug-подпись: разрешите установку из неизвестных источников. Разработчик: @yfeeeee" \
            --target "$GITHUB_SHA"
