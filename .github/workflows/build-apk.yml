# Сборка Android-приложения (APK). Developer: @yfeeeee
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Адрес сервера на Railway, например https://pixel-miners.up.railway.app"
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ inputs.server_url || vars.SERVER_URL || 'https://test-production-46b1.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить адрес сервера
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::Укажите адрес сервера при запуске (поле server_url) или задайте переменную репозитория SERVER_URL"
            exit 1
          fi
          case "$SERVER_URL" in https://*) ;; *) echo "::error::Адрес должен начинаться с https://"; exit 1;; esac

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установить зависимости
        working-directory: app
        run: npm install

      - name: Создать конфиг и Android-проект
        working-directory: app
        run: |
          node scripts/make-config.js
          npx cap add android

      - name: Иконка и ориентация
        working-directory: app
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            for name in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert ../public/icons/icon-512.png -filter point -resize ${s}x${s} $RES/mipmap-$d/$name.png
            done
          done
          sed -i 's/<activity$/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Собрать APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Подготовить файл
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk PixelMiners.apk

      - name: Опубликовать релиз с APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" PixelMiners.apk \
            --title "Pixel Miners APK #${{ github.run_number }}" \
            --notes "Android-приложение Pixel Miners. Сервер: $SERVER_URL. Developer: @yfeeeee"

      - uses: actions/upload-artifact@v4
        with:
          name: PixelMiners-apk
          path: PixelMiners.apk
