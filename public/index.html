<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="@yfeeeee">
<meta name="theme-color" content="#07050f">
<title>Охотники за Ядром</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/icon.webp">
<style>
/* Тёмное фэнтези: глубокий фиолет, золото для наград, голубой кристалл для действий. Узкий экран, нижняя навигация. */
:root{--bg:#07050f;--panel:#120d22;--panel2:#1c1536;--line:#2b2150;--text:#ece8ff;--mut:#8f86b8;--gold:#ffc857;--cry:#b44bff;--red:#ff5d73;--grn:#3ddc84;--disp:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 var(--body)}
body{display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;background:var(--bg) url(img/bg/menu.webp) center/cover;position:relative;overflow:hidden}
#app::before{content:"";position:absolute;inset:0;background:rgba(7,5,15,.6);pointer-events:none}
#app>*{position:relative}
header{background:linear-gradient(#150f2b,#0d0820);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}
.logo{font:800 17px var(--disp);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.logo img{width:30px;height:30px;border-radius:50%}
.cur{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 6px;font-weight:800}
.cur img{width:22px;height:22px}
main{flex:1;overflow-y:auto;padding:0 12px 12px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(26,20,50,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--mut);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--body);cursor:pointer}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--cry)}
button{font-family:var(--body)}
.btn{border:0;border-radius:12px;padding:13px;font:800 15px var(--body);color:#fff;background:linear-gradient(#c66bff,#7a4bff);color:#fff;cursor:pointer;width:100%;box-shadow:0 3px 0 #3d2394}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3d2394}
.btn.gold{background:linear-gradient(#ffd166,#ffb02e);box-shadow:0 3px 0 #9c6410;color:#2b1700}
.btn.gray{background:var(--panel2);color:var(--text);box-shadow:0 3px 0 #07050f;border:1px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:rgba(26,20,50,.88);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h2{font:800 19px var(--disp);margin:4px 2px 10px}
.mut{color:var(--mut);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.bar{height:11px;border-radius:6px;background:#0a0716;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .25s}
.hpb{background:linear-gradient(90deg,#ff3d5a,#ff8a5c)}.myb{background:linear-gradient(90deg,#27c26b,#7dff9f)}.dur{background:linear-gradient(#ffd77a,#e8a02e)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.boss{background:rgba(26,20,50,.9);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.boss .pic{height:92px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 60%,rgba(120,80,255,.28),transparent 70%);border-radius:10px}
.boss .pic img{max-width:100%;max-height:88px;object-fit:contain;filter:drop-shadow(0 4px 6px #000a)}
.boss b{font:800 14px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boss.dead .pic img{filter:grayscale(1) brightness(.5)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mut)}
.tag img{width:16px;height:16px}
.lvl{font-size:11px;font-weight:800;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--gold)}
#arena{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;height:300px;background:url(img/bg/arena.webp) center/cover;display:flex;align-items:flex-end;justify-content:center}
#arena img{height:230px;max-width:90%;object-fit:contain;margin-bottom:34px;filter:drop-shadow(0 8px 10px #000b)}
#arena.hit img{animation:sh .2s}
@keyframes sh{20%{transform:translateX(-8px) scale(.97)}60%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){#arena.hit img{animation:none}}
.float{position:absolute;left:50%;top:40%;font:800 22px var(--body);color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;animation:up .9s forwards}
@keyframes up{to{transform:translate(-50%,-60px);opacity:0}}
.slotrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.slot{flex:none;width:64px;height:64px;border-radius:12px;background:var(--panel);border:2px solid var(--rc,#555);box-shadow:0 0 10px -2px var(--rc,#555) inset;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.slot img{width:48px;height:48px;object-fit:contain}
.slot.sel{outline:2px solid var(--cry);outline-offset:2px}
.slot.broken img{filter:grayscale(1);opacity:.5}
.slot s{position:absolute;right:3px;bottom:2px;font:800 10px var(--body);text-decoration:none;color:#fff;text-shadow:0 1px 2px #000}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px}.stats b{color:var(--text)}.stats span{color:var(--mut)}
.cost{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13.5px}
.cost .l{display:flex;align-items:center;gap:6px}.cost img{width:22px;height:22px}
.ok{color:var(--grn)}.bad{color:var(--red)}
.toast{position:absolute;left:12px;right:12px;top:58px;z-index:9;background:#2a2150;border:1px solid var(--cry);border-radius:12px;padding:9px 12px;font-weight:600;font-size:13.5px;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.log div{font-size:12.5px;color:var(--mut);padding:1px 0}.log div:first-child{color:var(--text)}
input{background:#0f0a22;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font:600 14px var(--body);flex:1;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--cry);outline-offset:1px}
.me{background:rgba(74,168,255,.14);border-radius:8px}
.chip{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.chip button{flex:none;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font:700 12.5px var(--body)}.chip button.on{color:#fff;background:var(--cry);border-color:var(--cry)}
footer{text-align:center;color:var(--mut);font-size:11px;padding:2px 0 6px}

.hidden{display:none!important}
#login{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(14,10,28,.72)}
#login img.big{width:150px;height:150px;border-radius:50%;box-shadow:0 0 40px #b44bffaa}
#login h1{font:900 30px var(--disp);margin:0}
#login p{margin:0;color:var(--mut);max-width:300px}
#login .box{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;align-items:center}
#login .err{color:var(--red);min-height:18px;font-size:13px}
.modal{position:absolute;inset:0;z-index:30;background:rgba(5,3,14,.78);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px}
.modal .title{font:800 19px var(--disp)}
</style>
</head>
<body>
<div id="app">
 <div id="login" class="hidden">
  <img class="big" src="img/icon.webp" alt="">
  <h1>Охотники за Ядром</h1>
  <p>Общие бои с боссами, добыча материалов и прокачка снаряжения вместе с другими игроками.</p>
  <div class="box">
   <div id="tgwidget" style="min-height:44px"></div>
   <button class="btn" id="botlogin" type="button">Войти через бота</button>
   <button class="btn gray hidden" id="devlogin" type="button">Тестовый вход</button>
   <div class="err" id="loginerr"></div>
  </div>
  <p style="font-size:11.5px">Developer: @yfeeeee</p>
 </div>
 <header><div class="logo"><img src="img/icon.webp" alt="">Охотники за Ядром</div><div class="cur"><img src="img/res/credits.webp" alt=""><span id="cr">0</span></div></header>
 <div id="tt"></div>
 <main id="sc"></main>
 <footer id="foot">Developer: @yfeeeee</footer>
 <nav id="nav">
  <button data-t="boss"><svg viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M9.5 6.5 21 18v3h-3L6.5 9.5M11 5 5 11M8 8 4 4M5 3 3 5"/></svg>Бои</button>
  <button data-t="eq"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.2 7.8 8 9 4.8-1.2 8-4.5 8-9V6z"/></svg>Снаряжение</button>
  <button data-t="inv"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>Склад</button>
  <button data-t="top"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Топ и чат</button>
 </nav>
 <div id="update-modal" class="modal hidden"><div class="panel"><div class="title">Доступно обновление</div><p class="mut" id="update-text"></p><button class="btn" id="update-ok" type="button">Скачать обновление</button><button class="btn gray" id="update-later" type="button">Позже</button></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
